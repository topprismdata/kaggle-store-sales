name: M5 scaffold tests

on:
  push:
    branches: [research/m5-study-v1]
    paths:
      - "m5/**"
  pull_request:
    paths:
      - "m5/**"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.3.3 pytest==8.4.2
      - name: Run scaffold tests
        run: python -m pytest m5/tests -q

  en: >-
    What reusable ML knowledge can a Cultivating ML Agent crystallize
    from a longitudinal time-series competition project, including
    its failures and CV/LB gap stories?
  zh: >-
    Cultivating ML Agent 在一个长期时序竞赛项目中，能把哪些可复用的
    ML 知识（包括失败与 CV/LB gap 故事）结晶下来？

platform:
  system: native_ai
  layer: agent_capability
  solution: kaggle_learning_project

website:

topprism:
  purpose: learning_project
  capability: time_series_ml
  maturity: learning
  evidence:
    type: kaggle_benchmark
    scope: >-
      Store Sales Time Series Forecasting (54 stores x 33 product
      families x 16-day forecast horizon, RMSLE metric). Best
      reproducible result: LightGBM baseline with ffill fix, public
      LB ~ 1.90248 (per docs/competition-log.md v3).
  parent:
    - cultivating_ml_agent
  product_relationship: "This is not a customer product."

